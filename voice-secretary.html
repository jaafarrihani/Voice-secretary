<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>المساعد - إدارة الحسابات</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2233;
    --card-light: #232d42;
    --accent: #3ddc97;
    --accent-dark: #2bb87d;
    --danger: #ff5c72;
    --text: #eef1f7;
    --text-dim: #8b93a7;
    --border: #2a3450;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    overflow-x: hidden;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar h1 { font-size: 19px; font-weight: 700; }
  .topbar .back-btn {
    background: none; border: none; color: var(--accent);
    font-size: 16px; cursor: pointer; padding: 6px 10px;
  }
  .net-status {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    background: #2a3450;
    color: var(--text-dim);
  }
  .net-status.offline { background: #3a2230; color: var(--danger); }

  /* Screens */
  .screen { display: none; flex: 1; flex-direction: column; padding: 16px; padding-bottom: 100px; }
  .screen.active { display: flex; }

  /* Home screen */
  .total-card {
    background: linear-gradient(135deg, var(--card-light), var(--card));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 18px;
    text-align: center;
  }
  .total-card .label { color: var(--text-dim); font-size: 14px; margin-bottom: 6px; }
  .total-card .amount { font-size: 34px; font-weight: 800; }
  .total-card .amount.negative { color: var(--danger); }
  .total-card .amount.positive { color: var(--accent); }

  .section-title {
    font-size: 15px;
    color: var(--text-dim);
    margin: 6px 4px 10px;
    font-weight: 600;
  }

  .person-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: background 0.15s;
  }
  .person-card:active { background: var(--card-light); }
  .person-info { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--card-light);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: var(--accent);
    flex-shrink: 0;
  }
  .person-name { font-size: 16px; font-weight: 600; }
  .person-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .person-balance { font-size: 16px; font-weight: 700; }
  .person-balance.positive { color: var(--accent); }
  .person-balance.negative { color: var(--danger); }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 20px;
    font-size: 14px;
    line-height: 1.8;
  }
  .empty-state .big-icon { font-size: 44px; margin-bottom: 10px; display: block; }

  /* Mic FAB */
  .mic-fab-wrap {
    position: fixed;
    bottom: 26px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    z-index: 20;
  }
  .mic-fab {
    width: 74px; height: 74px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border: none;
    box-shadow: 0 6px 24px rgba(61,220,151,0.4);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 30px;
    transition: transform 0.15s;
  }
  .mic-fab:active { transform: scale(0.92); }
  .mic-fab.listening {
    background: linear-gradient(135deg, var(--danger), #c73a52);
    box-shadow: 0 6px 24px rgba(255,92,114,0.5);
    animation: pulse 1.3s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,92,114,0.5); }
    70% { box-shadow: 0 0 0 18px rgba(255,92,114,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,92,114,0); }
  }
  .manual-link {
    position: fixed;
    bottom: 34px;
    left: 26px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 48px; height: 48px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    cursor: pointer;
    z-index: 20;
  }

  /* Listening overlay */
  .listen-overlay {
    position: fixed; inset: 0;
    background: rgba(15,20,32,0.97);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
    text-align: center;
  }
  .listen-overlay.active { display: flex; }
  .listen-orb {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--danger), #c73a52);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
    margin-bottom: 24px;
    animation: pulse 1.3s infinite;
  }
  .listen-text { font-size: 17px; color: var(--text); margin-bottom: 8px; font-weight: 600; }
  .listen-sub { font-size: 14px; color: var(--text-dim); min-height: 22px; max-width: 300px; }
  .listen-cancel {
    margin-top: 30px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 28px;
    border-radius: 24px;
    font-size: 15px;
    cursor: pointer;
  }
  .processing-spinner {
    width: 40px; height: 40px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Confirm sheet */
  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    z-index: 100;
  }
  .sheet-overlay.active { display: flex; }
  .sheet {
    background: var(--card);
    width: 100%;
    border-radius: 22px 22px 0 0;
    padding: 24px 20px 30px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet h2 { font-size: 18px; margin-bottom: 18px; text-align: center; }
  .confirm-row {
    background: var(--card-light);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
    text-align: center;
  }
  .confirm-name { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .confirm-amount { font-size: 30px; font-weight: 800; }
  .confirm-amount.add { color: var(--accent); }
  .confirm-amount.sub { color: var(--danger); }
  .confirm-note { color: var(--text-dim); font-size: 13px; margin-top: 8px; }
  .btn-row { display: flex; gap: 12px; }
  .btn {
    flex: 1;
    padding: 15px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-confirm { background: var(--accent); color: #08301f; }
  .btn-cancel { background: var(--card-light); color: var(--text); border: 1px solid var(--border); }
  .btn-edit { background: none; color: var(--text-dim); border: 1px solid var(--border); }

  /* Manual form */
  .form-group { margin-bottom: 18px; }
  .form-label { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; display: block; }
  .form-input, .form-select {
    width: 100%;
    background: var(--card-light);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    color: var(--text);
    font-family: inherit;
  }
  .toggle-group { display: flex; gap: 10px; }
  .toggle-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card-light);
    color: var(--text-dim);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .toggle-btn.active-add { background: rgba(61,220,151,0.15); border-color: var(--accent); color: var(--accent); }
  .toggle-btn.active-sub { background: rgba(255,92,114,0.15); border-color: var(--danger); color: var(--danger); }

  /* Person detail */
  .balance-hero {
    text-align: center;
    padding: 20px 0 24px;
  }
  .balance-hero .amount { font-size: 40px; font-weight: 800; }
  .balance-hero .amount.positive { color: var(--accent); }
  .balance-hero .amount.negative { color: var(--danger); }
  .balance-hero .name { font-size: 15px; color: var(--text-dim); margin-top: 6px; }

  .tx-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .tx-left { display: flex; align-items: center; gap: 10px; }
  .tx-icon {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .tx-icon.add { background: rgba(61,220,151,0.15); color: var(--accent); }
  .tx-icon.sub { background: rgba(255,92,114,0.15); color: var(--danger); }
  .tx-date { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .tx-amount { font-size: 15px; font-weight: 700; }
  .tx-amount.add { color: var(--accent); }
  .tx-amount.sub { color: var(--danger); }
  .tx-note { font-size: 12px; color: var(--text-dim); }

  .fab-secondary {
    position: fixed;
    bottom: 26px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 14px;
    z-index: 20;
  }

  .toast {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card-light);
    border: 1px solid var(--border);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 14px;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s;
    max-width: 85%;
    text-align: center;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  .icon-btn {
    background: none; border: none; color: var(--text-dim);
    font-size: 20px; cursor: pointer; padding: 6px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- HOME SCREEN -->
  <div class="screen active" id="screen-home">
    <div class="topbar">
      <h1>💼 المساعد</h1>
      <div class="net-status" id="netStatus">متصل</div>
    </div>
    <div class="screen" style="display:flex; padding:16px;">
      <div class="total-card">
        <div class="label">إجمالي الأرصدة</div>
        <div class="amount" id="totalAmount">$0.00</div>
      </div>
      <div class="section-title">الحسابات</div>
      <div id="personList"></div>
    </div>
    <div class="manual-link" id="manualBtn" title="إدخال يدوي">✍️</div>
    <div class="mic-fab-wrap">
      <button class="mic-fab" id="micBtn">🎤</button>
    </div>
  </div>

  <!-- PERSON DETAIL SCREEN -->
  <div class="screen" id="screen-person">
    <div class="topbar">
      <button class="back-btn" id="backFromPerson">→ رجوع</button>
      <h1 id="personTitle">الحساب</h1>
      <button class="icon-btn" id="deletePersonBtn">🗑️</button>
    </div>
    <div class="balance-hero">
      <div class="amount" id="personBalance">$0.00</div>
      <div class="name" id="personNameSub"></div>
    </div>
    <div class="section-title">سجل المعاملات</div>
    <div id="txList"></div>
    <div class="fab-secondary">
      <button class="mic-fab" id="micBtnPerson" style="width:60px;height:60px;font-size:24px;">🎤</button>
    </div>
  </div>

</div>

<!-- LISTENING OVERLAY -->
<div class="listen-overlay" id="listenOverlay">
  <div id="listenPhase1">
    <div class="listen-orb">🎤</div>
    <div class="listen-text">بسمعك...</div>
    <div class="listen-sub" id="liveTranscript">قول مثلاً: "ضيف خمسين لأحمد"</div>
  </div>
  <div id="listenPhase2" style="display:none;">
    <div class="processing-spinner"></div>
    <div class="listen-text">عم افهم الطلب...</div>
    <div class="listen-sub" id="processingText"></div>
  </div>
  <button class="listen-cancel" id="cancelListen">إلغاء</button>
</div>

<!-- CONFIRM SHEET -->
<div class="sheet-overlay" id="confirmOverlay">
  <div class="sheet">
    <h2>تأكيد المعاملة</h2>
    <div class="confirm-row">
      <div class="confirm-name" id="confirmName">-</div>
      <div class="confirm-amount" id="confirmAmount">-</div>
      <div class="confirm-note" id="confirmNote"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-cancel" id="confirmCancel">إلغاء</button>
      <button class="btn btn-confirm" id="confirmOk">تأكيد وتسجيل</button>
    </div>
  </div>
</div>

<!-- MANUAL ENTRY SHEET -->
<div class="sheet-overlay" id="manualOverlay">
  <div class="sheet">
    <h2>إدخال يدوي</h2>
    <div class="form-group">
      <label class="form-label">الاسم</label>
      <input type="text" class="form-input" id="manualName" list="namesList" placeholder="اسم الشخص">
      <datalist id="namesList"></datalist>
    </div>
    <div class="form-group">
      <label class="form-label">المبلغ ($)</label>
      <input type="number" class="form-input" id="manualAmount" placeholder="0.00" step="0.01" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label">نوع العملية</label>
      <div class="toggle-group">
        <button class="toggle-btn active-add" id="toggleAdd">➕ إضافة</button>
        <button class="toggle-btn" id="toggleSub">➖ خصم</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">ملاحظة (اختياري)</label>
      <input type="text" class="form-input" id="manualNote" placeholder="مثلاً: دفعة أولى">
    </div>
    <div class="btn-row">
      <button class="btn btn-cancel" id="manualCancel">إلغاء</button>
      <button class="btn btn-confirm" id="manualSubmit">تسجيل</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  // ---------- STATE & STORAGE ----------
  var STORAGE_KEY = 'voice_secretary_v1';
  var state = { people: {} }; // people: { id: { name, transactions: [{id, amount, type, note, date}] } }
  var currentPersonId = null;
  var manualType = 'add';
  var recognition = null;
  var isListening = false;
  var finalTranscript = '';
  var pendingResult = null; // { name, amount, type, note, personId }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = JSON.parse(raw);
    } catch(e) { console.error('load error', e); }
  }
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch(e) { console.error('save error', e); showToast('خطأ بحفظ البيانات', true); }
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function normalizeName(n) {
    return (n || '').trim().replace(/\s+/g, ' ');
  }

  function findPersonByName(name) {
    var norm = normalizeName(name).toLowerCase();
    for (var id in state.people) {
      if (state.people[id].name.trim().toLowerCase() === norm) return id;
    }
    return null;
  }

  function getOrCreatePerson(name) {
    var clean = normalizeName(name);
    var id = findPersonByName(clean);
    if (id) return id;
    id = uid();
    state.people[id] = { name: clean, transactions: [] };
    return id;
  }

  function getBalance(personId) {
    var p = state.people[personId];
    if (!p) return 0;
    var bal = 0;
    p.transactions.forEach(function(t) {
      bal += (t.type === 'add' ? 1 : -1) * t.amount;
    });
    return bal;
  }

  function fmtMoney(n) {
    var sign = n < 0 ? '-' : '';
    return sign + '$' + Math.abs(n).toFixed(2);
  }

  // ---------- TOAST ----------
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toastEl.className = 'toast'; }, 2800);
  }

  // ---------- NAVIGATION ----------
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  // ---------- RENDER: HOME ----------
  function renderHome() {
    var list = document.getElementById('personList');
    var ids = Object.keys(state.people);
    var totalEl = document.getElementById('totalAmount');

    var total = 0;
    ids.forEach(function(id) { total += getBalance(id); });
    totalEl.textContent = fmtMoney(total);
    totalEl.className = 'amount ' + (total >= 0 ? 'positive' : 'negative');

    if (ids.length === 0) {
      list.innerHTML = '<div class="empty-state"><span class="big-icon">🎙️</span>ما في حسابات لسا.<br>اضغط زر الميكروفون وقول مثلاً:<br>"ضيف خمسين دولار لأحمد"</div>';
      return;
    }

    // sort by most recent transaction
    ids.sort(function(a, b) {
      var ta = state.people[a].transactions;
      var tb = state.people[b].transactions;
      var da = ta.length ? ta[ta.length-1].date : 0;
      var db = tb.length ? tb[tb.length-1].date : 0;
      return db - da;
    });

    list.innerHTML = ids.map(function(id) {
      var p = state.people[id];
      var bal = getBalance(id);
      var initial = p.name.trim().charAt(0) || '?';
      return '<div class="person-card" data-id="' + id + '">' +
        '<div class="person-info">' +
          '<div class="avatar">' + initial + '</div>' +
          '<div><div class="person-name">' + escapeHtml(p.name) + '</div>' +
          '<div class="person-sub">' + p.transactions.length + ' معاملة</div></div>' +
        '</div>' +
        '<div class="person-balance ' + (bal >= 0 ? 'positive' : 'negative') + '">' + fmtMoney(bal) + '</div>' +
      '</div>';
    }).join('');
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- RENDER: PERSON DETAIL ----------
  function renderPerson(id) {
    var p = state.people[id];
    if (!p) return;
    currentPersonId = id;
    document.getElementById('personTitle').textContent = p.name;
    document.getElementById('personNameSub').textContent = p.name;
    var bal = getBalance(id);
    var balEl = document.getElementById('personBalance');
    balEl.textContent = fmtMoney(bal);
    balEl.className = 'amount ' + (bal >= 0 ? 'positive' : 'negative');

    var txList = document.getElementById('txList');
    if (p.transactions.length === 0) {
      txList.innerHTML = '<div class="empty-state">ما في معاملات لسا لهاد الشخص.</div>';
    } else {
      var sorted = p.transactions.slice().sort(function(a,b){ return b.date - a.date; });
      txList.innerHTML = sorted.map(function(t) {
        var d = new Date(t.date);
        var dateStr = d.toLocaleDateString('ar-LB', { day:'numeric', month:'short', year:'numeric' }) +
                      ' - ' + d.toLocaleTimeString('ar-LB', { hour:'2-digit', minute:'2-digit' });
        return '<div class="tx-item">' +
          '<div class="tx-left">' +
            '<div class="tx-icon ' + t.type + '">' + (t.type === 'add' ? '➕' : '➖') + '</div>' +
            '<div><div class="tx-date">' + dateStr + '</div>' +
            (t.note ? '<div class="tx-note">' + escapeHtml(t.note) + '</div>' : '') + '</div>' +
          '</div>' +
          '<div class="tx-amount ' + t.type + '">' + (t.type === 'add' ? '+' : '-') + '$' + t.amount.toFixed(2) + '</div>' +
        '</div>';
      }).join('');
    }
    showScreen('screen-person');
  }

  document.getElementById('personList').addEventListener('click', function(e) {
    var card = e.target.closest('.person-card');
    if (card) renderPerson(card.dataset.id);
  });
  document.getElementById('backFromPerson').addEventListener('click', function() {
    renderHome();
    showScreen('screen-home');
  });
  document.getElementById('deletePersonBtn').addEventListener('click', function() {
    if (!currentPersonId) return;
    var p = state.people[currentPersonId];
    if (confirm('حذف حساب ' + p.name + ' نهائياً؟ رح ينمحي كل السجل.')) {
      delete state.people[currentPersonId];
      saveState();
      renderHome();
      showScreen('screen-home');
    }
  });

  // ---------- NETWORK STATUS ----------
  function updateNetStatus() {
    var el = document.getElementById('netStatus');
    if (navigator.onLine) {
      el.textContent = 'متصل';
      el.className = 'net-status';
    } else {
      el.textContent = 'غير متصل';
      el.className = 'net-status offline';
    }
  }
  window.addEventListener('online', updateNetStatus);
  window.addEventListener('offline', updateNetStatus);

  // ---------- SPEECH RECOGNITION ----------
  function getSpeechRecognition() {
    return window.SpeechRecognition || window.webkitSpeechRecognition;
  }

  function startListening() {
    var SR = getSpeechRecognition();
    if (!SR) {
      showToast('التسجيل الصوتي غير مدعوم بهاد الجهاز، رح نستخدم الإدخال اليدوي', true);
      openManual();
      return;
    }
    finalTranscript = '';
    document.getElementById('listenPhase1').style.display = 'block';
    document.getElementById('listenPhase2').style.display = 'none';
    document.getElementById('liveTranscript').textContent = 'قول مثلاً: "ضيف خمسين لأحمد"';
    document.getElementById('listenOverlay').classList.add('active');

    recognition = new SR();
    recognition.lang = 'ar-LB';
    recognition.interimResults = true;
    recognition.continuous = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = function(event) {
      var interim = '';
      finalTranscript = '';
      for (var i = 0; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          finalTranscript += event.results[i][0].transcript;
        } else {
          interim += event.results[i][0].transcript;
        }
      }
      document.getElementById('liveTranscript').textContent = finalTranscript || interim || '...';
    };

    recognition.onerror = function(event) {
      isListening = false;
      document.getElementById('listenOverlay').classList.remove('active');
      if (event.error === 'no-speech') {
        showToast('ما سمعت شي، حاول كمان مرة', true);
      } else if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        showToast('لازم تسمح باستخدام الميكروفون', true);
      } else {
        showToast('صار خطأ بالتسجيل الصوتي', true);
      }
    };

    recognition.onend = function() {
      isListening = false;
      if (finalTranscript && finalTranscript.trim()) {
        processTranscript(finalTranscript.trim());
      } else {
        document.getElementById('listenOverlay').classList.remove('active');
      }
    };

    try {
      recognition.start();
      isListening = true;
    } catch(e) {
      document.getElementById('listenOverlay').classList.remove('active');
      showToast('ما قدرت افتح الميكروفون', true);
    }
  }

  document.getElementById('cancelListen').addEventListener('click', function() {
    if (recognition && isListening) {
      recognition.onend = null;
      recognition.stop();
    }
    isListening = false;
    document.getElementById('listenOverlay').classList.remove('active');
  });

  document.getElementById('micBtn').addEventListener('click', startListening);
  document.getElementById('micBtnPerson').addEventListener('click', startListening);

  // ---------- AI PARSING ----------
  function processTranscript(text) {
    if (!navigator.onLine) {
      document.getElementById('listenOverlay').classList.remove('active');
      showToast('لا يوجد اتصال بالإنترنت، رح نفتح الإدخال اليدوي', true);
      openManual();
      return;
    }

    document.getElementById('listenPhase1').style.display = 'none';
    document.getElementById('listenPhase2').style.display = 'block';
    document.getElementById('processingText').textContent = '"' + text + '"';

    var existingNames = Object.keys(state.people).map(function(id) { return state.people[id].name; });

    var systemPrompt = 'انت مساعد بيحلل جملة عربية (فصحى او لهجة لبنانية) وبيطلع منها معاملة مالية.\n' +
      'رجّع بس JSON بدون أي نص إضافي أو Markdown، بهاد الشكل بالضبط:\n' +
      '{"name": "اسم الشخص", "amount": رقم موجب, "type": "add" او "subtract", "note": "ملاحظة قصيرة او فارغة", "understood": true او false}\n' +
      'قواعد:\n' +
      '- "add" لما تكون الكلمة زيادة/إضافة/دفع/ضيف/زود/أعطي/سلفة عم تنعطى لهاد الشخص.\n' +
      '- "subtract" لما تكون الكلمة خصم/شيل/انقص/سحب/رجع/دفعلي.\n' +
      '- استخرج الاسم بالضبط متل ما انحكى، بس صحح الإملاء البسيط إذا واضح.\n' +
      '- إذا في اسم موجود مسبقاً بهاد اللائحة وقريب من الاسم المذكور، استخدم الاسم الموجود بالضبط: [' + existingNames.join(', ') + ']\n' +
      '- الأرقام: "خمسين" = 50، "ميه" = 100، "مية وعشرين" = 120، الخ. افهم الأرقام المكتوبة بالحروف بالعربي.\n' +
      '- إذا الجملة مش واضحة او ناقصة (بدون اسم او بدون رقم)، رجّع understood: false.\n' +
      'رجّع JSON بس، بدون شرح.';

    fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 300,
        system: systemPrompt,
        messages: [{ role: 'user', content: text }]
      })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      document.getElementById('listenOverlay').classList.remove('active');
      var raw = '';
      if (data && data.content) {
        data.content.forEach(function(block) {
          if (block.type === 'text') raw += block.text;
        });
      }
      raw = raw.trim().replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
      var parsed;
      try {
        parsed = JSON.parse(raw);
      } catch(e) {
        console.error('parse error', e, raw);
        showToast('ما قدرت افهم الطلب، جرب كمان مرة او استخدم الإدخال اليدوي', true);
        return;
      }
      if (!parsed.understood || !parsed.name || !parsed.amount) {
        showToast('ما فهمت الطلب منيح، جرب تحكي بوضوح أكتر او استخدم الإدخال اليدوي', true);
        return;
      }
      openConfirm({
        name: parsed.name,
        amount: Math.abs(parseFloat(parsed.amount)),
        type: parsed.type === 'subtract' ? 'sub' : 'add',
        note: parsed.note || ''
      });
    })
    .catch(function(err) {
      console.error(err);
      document.getElementById('listenOverlay').classList.remove('active');
      showToast('صار خطأ بالاتصال، جرب كمان مرة', true);
    });
  }

  // ---------- CONFIRM SHEET ----------
  function openConfirm(result) {
    pendingResult = result;
    document.getElementById('confirmName').textContent = result.name;
    var amtEl = document.getElementById('confirmAmount');
    amtEl.textContent = (result.type === 'add' ? '+ $' : '- $') + result.amount.toFixed(2);
    amtEl.className = 'confirm-amount ' + result.type;
    document.getElementById('confirmNote').textContent = result.note || '';
    document.getElementById('confirmOverlay').classList.add('active');
  }

  document.getElementById('confirmCancel').addEventListener('click', function() {
    pendingResult = null;
    document.getElementById('confirmOverlay').classList.remove('active');
  });

  document.getElementById('confirmOk').addEventListener('click', function() {
    if (!pendingResult) return;
    var personId = getOrCreatePerson(pendingResult.name);
    state.people[personId].transactions.push({
      id: uid(),
      amount: pendingResult.amount,
      type: pendingResult.type,
      note: pendingResult.note || '',
      date: Date.now()
    });
    saveState();
    document.getElementById('confirmOverlay').classList.remove('active');
    showToast('تم تسجيل المعاملة ✓');
    var name = state.people[personId].name;
    pendingResult = null;

    renderHome();
    if (currentPersonId === personId) {
      renderPerson(personId);
    } else {
      showScreen('screen-home');
    }
  });

  // ---------- MANUAL ENTRY ----------
  function openManual() {
    document.getElementById('manualName').value = currentPersonId ? state.people[currentPersonId].name : '';
    document.getElementById('manualAmount').value = '';
    document.getElementById('manualNote').value = '';
    setManualType('add');
    var datalist = document.getElementById('namesList');
    datalist.innerHTML = Object.keys(state.people).map(function(id) {
      return '<option value="' + escapeHtml(state.people[id].name) + '">';
    }).join('');
    document.getElementById('manualOverlay').classList.add('active');
  }

  function setManualType(type) {
    manualType = type;
    var addBtn = document.getElementById('toggleAdd');
    var subBtn = document.getElementById('toggleSub');
    addBtn.className = 'toggle-btn' + (type === 'add' ? ' active-add' : '');
    subBtn.className = 'toggle-btn' + (type === 'sub' ? ' active-sub' : '');
  }

  document.getElementById('manualBtn').addEventListener('click', openManual);
  document.getElementById('toggleAdd').addEventListener('click', function() { setManualType('add'); });
  document.getElementById('toggleSub').addEventListener('click', function() { setManualType('sub'); });
  document.getElementById('manualCancel').addEventListener('click', function() {
    document.getElementById('manualOverlay').classList.remove('active');
  });

  document.getElementById('manualSubmit').addEventListener('click', function() {
    var name = normalizeName(document.getElementById('manualName').value);
    var amount = parseFloat(document.getElementById('manualAmount').value);
    var note = document.getElementById('manualNote').value.trim();

    if (!name) { showToast('لازم تكتب اسم', true); return; }
    if (!amount || amount <= 0) { showToast('لازم تكتب مبلغ صحيح', true); return; }

    var personId = getOrCreatePerson(name);
    state.people[personId].transactions.push({
      id: uid(),
      amount: Math.abs(amount),
      type: manualType,
      note: note,
      date: Date.now()
    });
    saveState();
    document.getElementById('manualOverlay').classList.remove('active');
    showToast('تم تسجيل المعاملة ✓');

    renderHome();
    if (currentPersonId === personId) {
      renderPerson(personId);
    } else {
      showScreen('screen-home');
    }
  });

  // ---------- INIT ----------
  loadState();
  updateNetStatus();
  renderHome();
})();
</script>
</body>
</html>
